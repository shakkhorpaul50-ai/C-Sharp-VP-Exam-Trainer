<script>

const topics = [
    // =================== 1. POLYMORPHISM ===================
    {
        id: 'polymorphism',
        name: 'Polymorphism',
        icon: '🔄',
        syntax: `<div class="card">
            <h3>Polymorphism — Syntax Reference</h3>
            <p><strong>Polymorphism</strong> means "many forms" — the same method call behaves differently based on the actual object.</p>

            <div class="syntax-section">1ï¸âƒ£ Static Polymorphism — Method Overloading (Compile-time)</div>
            <p class="syntax-desc">Same method name, different parameter list. No extra keyword needed. The compiler chooses the right version.</p>
            <div class="code-block"><span class="com">// Overloading: same name, different parameters</span>

<span class="kw">public class</span> <span class="cls">Calculator</span> {

    <span class="com">// Version 1: two ints</span>
    <span class="kw">public int</span> Add(<span class="kw">int</span> a, <span class="kw">int</span> b) {
        <span class="kw">return</span> a + b;
    }

    <span class="com">// Version 2: three ints</span>
    <span class="kw">public int</span> Add(<span class="kw">int</span> a, <span class="kw">int</span> b, <span class="kw">int</span> c) {
        <span class="kw">return</span> a + b + c;
    }

    <span class="com">// Version 3: two strings</span>
    <span class="kw">public string</span> Add(<span class="kw">string</span> a, <span class="kw">string</span> b) {
        <span class="kw">return</span> a + b;
    }
}</div>

            <div class="syntax-section">2ï¸âƒ£ Dynamic Polymorphism — Method Overriding (Run-time)</div>
            <p class="syntax-desc">Base class marks method with <code>virtual</code>. Child class replaces it with <code>override</code>.</p>
            <div class="code-block"><span class="com">// Base class: allows overriding</span>
<span class="kw">public class</span> <span class="cls">Shape</span> {

    <span class="kw">public virtual void</span> Draw() {
        Console.WriteLine(<span class="str">"Drawing a generic shape"</span>);
    }
}

<span class="com">// Child class: overrides the behavior</span>
<span class="kw">public class</span> <span class="cls">Circle</span> : Shape {

    <span class="kw">public override void</span> Draw() {
        Console.WriteLine(<span class="str">"Drawing a circle"</span>);
    }
}</div>

            <div class="syntax-section">3ï¸âƒ£ How to Use It</div>
            <p class="syntax-desc">Store a child object in a parent variable. The Run-time picks the correct method.</p>
            <div class="code-block"><span class="com">// Parent reference → child object</span>
Shape s = <span class="kw">new</span> Circle();

<span class="com">// Calls Circle.Draw(), not Shape.Draw()</span>
s.Draw();  <span class="com">// Output: "Drawing a circle"</span></div>

            <p><strong>Key Keywords:</strong></p>
            <ul style="margin-left:20px; line-height:2; font-size:14px;">
                <li><code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">virtual</code> — in base class, says "you CAN override me"</li>
                <li><code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">override</code> — in child class, says "I AM replacing the base method"</li>
                <li><code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">overload</code> — no keyword, just same name + different parameters</li>
            </ul>
        </div>`,
        howItWorks: `<div class="card">
            <h3>How Polymorphism Actually Works</h3>
            <p>Imagine you are building a <strong>Zoo Application</strong>. You have a base class <code>Animal</code> and many child classes: <code>Dog</code>, <code>Cat</code>, <code>Cow</code>. Every animal makes a sound, but each sounds different.</p>
            <p>Without polymorphism, you would need <code>if-else</code> or <code>switch</code> statements to check the type of animal and call the right sound. With polymorphism, you just call <code>animal.MakeSound()</code> and C# automatically knows which version to run based on the actual object.</p>
            <div class="code-block"><span class="com">// Base class</span>
<span class="kw">public class</span> <span class="cls">Animal</span> {
    <span class="kw">public virtual void</span> MakeSound() {
        Console.WriteLine(<span class="str">"Some generic animal sound"</span>);
    }
}

<span class="kw">public class</span> <span class="cls">Dog</span> : Animal {
    <span class="kw">public override void</span> MakeSound() {
        Console.WriteLine(<span class="str">"Woof! Woof!"</span>);
    }
}

<span class="kw">public class</span> <span class="cls">Cat</span> : Animal {
    <span class="kw">public override void</span> MakeSound() {
        Console.WriteLine(<span class="str">"Meow!"</span>);
    }
}

<span class="com">// In your Main method:</span>
Animal[] zoo = <span class="kw">new</span> Animal[] { <span class="kw">new</span> Dog(), <span class="kw">new</span> Cat(), <span class="kw">new</span> Animal() };
<span class="kw">foreach</span> (Animal a <span class="kw">in</span> zoo) {
    a.MakeSound(); <span class="com">// Calls Dog.MakeSound() or Cat.MakeSound() automatically!</span>
}
<span class="com">// Output: Woof! Woof! / Meow! / Some generic animal sound</span></div>
            <p>The C# runtime looks at the <strong>actual object type</strong> (not the variable type) and calls the most derived override. This is called <strong>dynamic dispatch</strong>.</p>

    <span class="kw">public string</span> DeptName { <span class="kw">get</span>; <span class="kw">set</span>; }

}</div>

            <div class="syntax-section">2ï¸âƒ£ try-catch-finally</div>
            <p class="syntax-desc"><code>finally</code> ALWAYS runs — even if no error. Perfect for cleanup (close files, DB).</p>

}
<span class="kw">catch</span> (IndexOutOfRangeException ex) {

}
<span class="kw">finally</span> {

}</div>

            <div class="syntax-section">3ï¸âƒ£ Multiple catch (Specific → General)</div>

}
<span class="kw">catch</span> (NullReferenceException ex) {

}
<span class="kw">catch</span> (Exception ex) {

        howItWorks: `<div class="card">
            <h3>How Exception Handling Actually Works</h3>
            <p>Imagine you are building a <strong>Bank Application</strong>. A user tries to withdraw more money than they have, or enters a negative amount, or the database connection fails. Without exception handling, the program crashes and the user loses trust. With exception handling, you catch the error, show a friendly message, and keep the program running.</p>
            <div class="code-block"><span class="kw">public class</span> <span class="cls">BankAccount</span> {
    <span class="kw">public string</span> Owner { <span class="kw">get</span>; <span class="kw">set</span>; }
    <span class="kw">public decimal</span> Balance { <span class="kw">get</span>; <span class="kw">set</span>; }
    
    <span class="kw">public</span> BankAccount(<span class="kw">string</span> owner, <span class="kw">decimal</span> initialBalance) {
        Owner = owner;
        Balance = initialBalance;
    }
    
    <span class="kw">public void</span> Withdraw(<span class="kw">decimal</span> amount) {
        <span class="kw">try</span> {
            <span class="com">// Check for invalid input</span>
            <span class="kw">if</span> (amount &lt;= <span class="num">0</span>)
                <span class="kw">throw new</span> ArgumentException(<span class="str">"Withdrawal must be positive"</span>);
            
            <span class="com">// Check for insufficient funds</span>
            <span class="kw">if</span> (amount &gt; Balance)
                <span class="kw">throw new</span> InvalidOperationException(<span class="str">"Insufficient funds"</span>);
            
            Balance -= amount;
            Console.WriteLine($<span class="str">"Withdrew {amount}. New balance: {Balance}"</span>);
        }
        <span class="kw">catch</span> (ArgumentException ex) {
            Console.WriteLine($<span class="str">"Invalid input: {ex.Message}"</span>);
        }
        <span class="kw">catch</span> (InvalidOperationException ex) {
            Console.WriteLine($<span class="str">"Transaction failed: {ex.Message}"</span>);
        }
        <span class="kw">finally</span> {
            Console.WriteLine(<span class="str">"Transaction attempt logged."</span>);
        }
    }
}

            <div class="syntax-section">2ï¸âƒ£ Common Operators — One Per Line</div>

        howItWorks: `<div class="card">
            <h3>How LINQ Actually Works</h3>
            <p>Imagine you have a list of 1000 students and you want to find all students who scored above 80, sorted by name. Without LINQ, you would write a for loop, an if statement, a temporary list, and a sort method. With LINQ, it's a single line.</p>
            <div class="code-block"><span class="com">// The old way (without LINQ):</span>
List&lt;Student&gt; honorStudents = <span class="kw">new</span> List&lt;Student&gt;();
<span class="kw">foreach</span> (<span class="kw">var</span> s <span class="kw">in</span> students) {

<span class="com">// Now sort by name... (more code)</span>

<span class="com">// The LINQ way (one line!):</span>
<span class="kw">var</span> honorStudents = students

            <p><strong>How a LINQ query executes:</strong></p>

                <div class="flow-box">Result</div>

            <p>Each operator is applied like a pipeline. <code>Where</code> filters, then <code>OrderBy</code> sorts the filtered result, then <code>ToList()</code> materializes it into a list.</p>

}

            <p><strong>Important:</strong> LINQ uses <strong>deferred execution</strong> — the query doesn't actually run until you iterate over it (e.g., with foreach) or call <code>.ToList()</code> / <code>.First()</code> etc.</p>

// CODE CHECKER
// =========================================================================

function checkCode(topicId, questionIndex) {
    const topic = topics.find(t => t.id === topicId);
    const question = topic.questions[questionIndex];
    const qId = `${topicId}-${questionIndex}`;
    const code = document.getElementById(`editor-${qId}`).value;
    const feedbackBox = document.getElementById(`feedback-${qId}`);
    const questionCard = document.getElementById(`question-${qId}`);
    
    if (!code.trim()) {
        feedbackBox.className = 'feedback-box error show';
        feedbackBox.innerHTML = '⚠ ï¸ Your code editor is empty. Please write some code first!';
        questionCard.className = 'question-card failed';
        return;
    }
    
    const codeLower = code.toLowerCase();
    const results = [];
    let allFound = true;
    
    question.requirements.forEach(req => {
        const found = codeLower.includes(req.keyword.toLowerCase());
        results.push({ ...req, found });
        if (!found) allFound = false;
    });
    
    let feedbackHtml = '';
    
    if (allFound) {
        feedbackHtml = `<strong>✅ Excellent! All requirements met!</strong><br>Your code contains all the key elements needed for this problem.`;
        feedbackHtml += `<ul class="req-list">`;
        results.forEach(r => {
            feedbackHtml += `<li><span class="req-check found">✓</span> ${r.desc} — <code style="background:#d1fae5;padding:1px 4px;border-radius:3px;">${r.keyword}</code></li>`;
        });
        feedbackHtml += `</ul>`;
        feedbackHtml += `<br><strong>💡 Note:</strong> This is a keyword-based checker. In a real exam, make sure your code also compiles and runs correctly!`;
        
        feedbackBox.className = 'feedback-box success show';
        questionCard.className = 'question-card solved';
        solvedQuestions[qId] = true;
    } else {
        const foundCount = results.filter(r => r.found).length;
        const totalCount = results.length;
        
        feedbackHtml = `<strong>📊 Progress: ${foundCount}/${totalCount} requirements found</strong>`;
        feedbackHtml += `<ul class="req-list">`;
        results.forEach(r => {
            const icon = r.found ? '✓' : '✗';
            const cls = r.found ? 'found' : 'missing';
            feedbackHtml += `<li><span class="req-check ${cls}">${icon}</span> ${r.desc} — <code style="background:${r.found ? '#d1fae5' : '#fee2e2'};padding:1px 4px;border-radius:3px;">${r.keyword}</code></li>`;
        });
        feedbackHtml += `</ul>`;
        
        const missing = results.filter(r => !r.found);
        if (missing.length > 0) {
            feedbackHtml += `<br><strong>⚠ ï¸ Missing:</strong> ${missing.map(m => `"${m.keyword}"`).join(', ')}`;
            feedbackHtml += `<br><em>Check the hint above for guidance on what to include.</em>`;
        }
        
        feedbackBox.className = 'feedback-box error show';
        questionCard.className = 'question-card failed';
    }
    
    feedbackBox.innerHTML = feedbackHtml;
    updateProgress();
}

function toggleHint(qId) {
    const hint = document.getElementById(`hint-${qId}`);
    hint.classList.toggle('show');
}

function clearCode(qId) {
    document.getElementById(`editor-${qId}`).value = '';
    document.getElementById(`feedback-${qId}`).className = 'feedback-box';
    document.getElementById(`feedback-${qId}`).innerHTML = '';
    document.getElementById(`question-${qId}`).className = 'question-card';
}

function toggleExpand(qId) {
    const editor = document.getElementById(`editor-${qId}`);
    const btn = document.getElementById(`expandBtn-${qId}`);
    if (!editor) return;
    editor.classList.toggle('expanded');
    const isExpanded = editor.classList.contains('expanded');
    if (btn) btn.textContent = isExpanded ? '🗺— Collapse' : '⛶ Expand';
    // Also update the bottom toggle button text if present
    const bottomBtns = document.querySelectorAll(`button[onclick="toggleExpand('${qId}')"]`);
    bottomBtns.forEach(b => {
        if (b.id !== `expandBtn-${qId}`) b.textContent = isExpanded ? '🗺— Collapse Full Height' : '⛶ Toggle Full Height';
    });
    if (isExpanded) {
        setTimeout(() => editor.scrollIntoView({behavior:'smooth', block:'center'}), 100);
        editor.focus();
    }
}

function updateProgress() {
    let totalQuestions = 0;
    topics.forEach(t => totalQuestions += t.questions.length);
    const solvedCount = Object.keys(solvedQuestions).filter(k => solvedQuestions[k]).length;
    const percent = (solvedCount / totalQuestions) * 100;
    document.getElementById('overallProgress').style.width = percent + '%';
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}
